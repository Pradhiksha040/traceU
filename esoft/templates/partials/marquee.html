{% load static %}

<div class="trusted-section text-center">

    <div class="container">

        <h2 class="section-title">
            Trusted by Leading Companies
        </h2>

        <p class="section-text">
            Helping businesses across industries make safe, reliable hiring decisions with fast and accurate background verification solutions.
        </p>

    </div>

</div>

<section class="marquee-section">

    <div class="marquee-track">

        <!-- Logos -->
        <img src="{% static 'img/marquee/logo1.png' %}" alt="">
        <img src="{% static 'img/marquee/1.png' %}" alt="">
        <img src="{% static 'img/marquee/2.png' %}" alt="">
        <img src="{% static 'img/marquee/3.png' %}" alt="">
        <img src="{% static 'img/marquee/7.png' %}" alt="">
        <img src="{% static 'img/marquee/11.png' %}" alt="">
        <img src="{% static 'img/marquee/12.png' %}" alt="">
        <img src="{% static 'img/marquee/14.png' %}" alt="">
        <img src="{% static 'img/marquee/16.png' %}" alt="">

        <!-- Duplicate for infinite loop -->
        <img src="{% static 'img/marquee/logo1.png' %}" alt="">
        <img src="{% static 'img/marquee/1.png' %}" alt="">
        <img src="{% static 'img/marquee/2.png' %}" alt="">
        <img src="{% static 'img/marquee/3.png' %}" alt="">
        <img src="{% static 'img/marquee/7.png' %}" alt="">
        <img src="{% static 'img/marquee/11.png' %}" alt="">
        <img src="{% static 'img/marquee/12.png' %}" alt="">
        <img src="{% static 'img/marquee/14.png' %}" alt="">
        <img src="{% static 'img/marquee/16.png' %}" alt="">

    </div>

</section>

<style>

.trusted-section{
    padding:60px 0 10px;
}

.marquee-section{
    width:100%;
    overflow:hidden;
    background:#fff;
    padding:10px 0 20px;
}

.marquee-track{
    display:flex;
    align-items:center;
    width:max-content;
    animation:scrollMarquee 25s linear infinite;
}

.marquee-track img{
    height:50px;
    width:auto;
    margin:0 20px;
    object-fit:contain;
    transition:0.3s ease;
}

.marquee-track img:hover{
    transform:scale(1.05);
}

@keyframes scrollMarquee{
    0%{
        transform:translateX(0);
    }
    100%{
        transform:translateX(-50%);
    }
}

@media (max-width:768px){

    .trusted-section{
        padding:80px 0 5px;
    }

    .marquee-section{
        padding:5px 0 15px;
    }

    .marquee-track img{
        height:35px;
        margin:0 12px;
    }

}

</style>
